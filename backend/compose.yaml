services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: safaridesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in backend/.env}
      POSTGRES_DB: safaridesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - safaridesk_pgdata_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safaridesk"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  safaridesk_pgdata_v18:
